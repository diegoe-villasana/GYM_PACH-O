const fmt = d => new Date(d).toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric'});
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
const diffDays = (a, b) => Math.round((new Date(b)-new Date(a))/86400000);
const fileIcon = name => {
  const ext = (name||'').split('.').pop().toLowerCase();
  if(['jpg','jpeg','png','gif','webp'].includes(ext)) return 'ti-photo';

let state = {
  view: 'dashboard', clientTab: 'info', rol:'entrenador',
  selectedClient: null, searchClients: '', searchPayments: '',

};

// ── Toast ──
function toast(msg, type='ok') {
  const el = document.createElement('div');
  el.className = 'toast' + (type==='error'?' error':'');
  el.textContent = msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}

// ── renderizado ──
async function loadAll() {
  const [{data:clients,error:e1},{data:pagos,error:e2},{data:asistencia,error:e3},{data:productos,error:e4},{data:ventas,error:e5}] = await Promise.all([
    db.from('clientes').select('*').order('created_at',{ascending:false}),
    db.from('pagos').select('*').order('fecha',{ascending:false}),
    db.from('asistencia').select('*').order('fecha',{ascending:false}),
    db.from('productos').select('*').order('nombre',{ascending:true}),
    db.from('ventas').select('*').order('created_at',{ascending:false}),
  ]);
  if(e1||e2){toast('Error cargando datos','error');return;}
  state.clients = clients||[];
  state.pagos = pagos||[];
  state.asistencia = asistencia||[];
  state.productos = productos||[];
  state.ventas = ventas||[];
  render();
}

async function createUser(data) {
  const {error} = await db.from('clientes').insert([data]);
  if(error) throw error;
  toast('Cliente creado');
  await loadAll();
} 

// ── Upload doc a Storage ──
async function uploadDoc(file, folder) {
  const ext = file.name.split('.').pop();
  const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const {error} = await db.storage.from('documentos').upload(path, file);
  if(error) throw error;
  return { name: file.name, path, size: file.size, fecha: new Date().toISOString() };
}

async function getDocUrl(path) {
  const {data} = await db.storage.from('documentos').createSignedUrl(path, 60);
  return data?.signedUrl;
}

async function openDoc(path) {
  const url = await getDocUrl(path);
  if(url) window.open(url, '_blank');
  else toast('No se pudo abrir el documento','error');
}

async function deleteDoc(clientId, path) {
  if(!confirm('¿Eliminar este documento?')) return;
  await db.storage.from('documentos').remove([path]);
  const c = state.clients.find(x=>x.id===clientId);
  const docs = (c.documentos||[]).filter(d=>d.path!==path);
  await db.from('clientes').update({documentos:docs}).eq('id',clientId);
  toast('Documento eliminado');
  await loadAll();
}

async function deletePagoDoc(pagoId, path) {
  if(!confirm('¿Eliminar este documento?')) return;
  await db.storage.from('documentos').remove([path]);
  const p = state.pagos.find(x=>x.id===pagoId);
  const docs = (p.documentos||[]).filter(d=>d.path!==path);
  await db.from('pagos').update({documentos:docs}).eq('id',pagoId);
  toast('Documento eliminado');
  await loadAll();
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const btn   = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.style.display='none';
  btn.disabled=true; btn.textContent='Entrando...';

  if(error){
    errEl.textContent='Email o contraseña incorrectos';

    btn.disabled=false; btn.textContent='Entrar';
    return;
  }

  await cargarPerfil(data.user.id);

async function cargarPerfil(uid) {
  const {data: perfil} = await db.from('usuarios')
    .select('rol, cliente_id, entrenador_id')
    .eq('id', uid)
    .maybeSingle();

  state.rol = perfil?.rol || 'cliente';
  state.selectedClient = perfil?.cliente_id || null;
  state.selectedEntrenador = perfil?.entrenador_id || null;
  state.view = state.rol === 'admin' ? 'dashboard'
             : state.rol === 'entrenador' ? 'Mis_clases'
             : 'mis-pagos';
}

function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  const errEl = document.getElementById('register-error');
  errEl.style.display='none';
  if(!name){errEl.textContent='El nombre es obligatorio';errEl.style.display='block';return;}
  if(!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){errEl.textContent='Ingresa un email válido';errEl.style.display='block';return;}
  if(pass.length<6){errEl.textContent='La contraseña debe tener al menos 6 caracteres';errEl.style.display='block';return;}
  if(pass!==pass2){errEl.textContent='Las contraseñas no coinciden';errEl.style.display='block';return;}
  const btn=document.getElementById('register-btn');
  btn.disabled=true; btn.textContent='Creando cuenta...';
  db.auth.signUp({email, password:pass})
    .then(async ({data, error})=>{
      if(error){
        errEl.textContent='Error al crear usuario: '+error.message;
        errEl.style.display='block';
        btn.disabled=false; btn.textContent='Crear usuario';
        return;
      }
      await db.from('clientes').insert([{nombre:name,email}]);
      toast('Usuario creado. Revisa tu email para confirmar.');
      btn.disabled=false; btn.textContent='Crear usuario';
      showLogin();
    })
    .catch(e=>{
      errEl.textContent='Error al crear usuario';
      errEl.style.display='block';
      btn.disabled=false; btn.textContent='Crear usuario';
    });
}

function getAlerts() {
  const alerts = [];
  state.clients.forEach(c => {
    if(c.estado!=='Activo') return;
    const days = diffDays(today, new Date(c.cobro));
    if(days===1)           alerts.push({type:'red',   msg:`⚠️ ${c.nombre} vence mañana`, id:c.id});
    else if(days<=3&&days>=0) alerts.push({type:'amber', msg:`📅 ${c.nombre} vence en ${days} días`, id:c.id});
    else if(days<0)        alerts.push({type:'red',   msg:`🔴 ${c.nombre} ha vencido hace ${Math.abs(days)} días`, id:c.id});
    const pend = state.pagos.find(p=>p.cliente_id===c.id&&p.estado==='Pendiente');
    if(pend) alerts.push({type:'amber', msg:`💳 ${c.nombre} no ha pagado (${fmt(pend.fecha)})`, id:c.id});
    const meses = Math.floor(diffDays(new Date(c.inicio),today)/30);
    if([3,6,12].includes(meses) && diffDays(new Date(c.inicio),today)%30<3)
      alerts.push({type:'blue', msg:`🎉 ${c.nombre} cumple ${meses} meses entrenando`, id:c.id});
  });
  return alerts;
}

function renderCalendario() {
  const asistencias = state.asistencia.filter(a=>a.cliente_id===state.selectedClient).map(a=>a.fecha);
  const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
  const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  const daysInMonth = lastDay.getDate();
  let html = `<div class="cal-wrap"><div class="cal-header"><div class="cal-month">${today.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</div></div><div class="cal-grid">`;
  for(let i=0;i<firstDay.getDay();i++) html += `<div class="cal-day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isPresent = asistencias.includes(dateStr);
    const isToday = dateStr === today.toISOString().slice(0,10);
    html += `<div class="cal-day ${isPresent?'present':''} ${isToday?'today':''}">${d}</div>`;
  }
  html += `</div><div class="cal-legend"><div><span class="cal-legend-dot" style="background:var(--accent)"></span> Asistencia</div></div></div>`;
  return html;
}

      <div class="alert-card" onclick="openClient(${a.id})">

// ── Asistencia global pantalla ──

          </div>
          <table>
            <thead><tr><th>Cliente</th><th>Última visita</th><th>Hoy</th></tr></thead>

              const asis = state.asistencia.filter(a=>a.cliente_id===c.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));

              const vino = asistHoy.find(a=>a.cliente_id===c.id);

              const esSel = state.clienteAsistencia===c.id;
              return `<tr style="${esSel?'background:var(--surface2)':''}">

                  <div style="font-size:11px;color:${color}">${diasSin===null?'Sin registros':diasSin===0?'Hoy':'hace '+diasSin+'d'}</div>
                </td>
                <td style="color:var(--text2);font-size:12px">${ultima?fmt(ultima):'Nunca'}</td>

function renderAsistenciaCliente(clientId) {
  const asis = state.asistencia.filter(a=>a.cliente_id===clientId);
  const hoy = today.toISOString().slice(0,10);
  const totalMes = asis.filter(a=>a.fecha.startsWith(hoy.slice(0,7))).length;
  const total = asis.length;
  // Usar mes guardado en state o el actual
  if(!state.calMes) state.calMes = { y: today.getFullYear(), m: today.getMonth() };
  const { y, m } = state.calMes;
  const mesNombre = new Date(y, m, 1).toLocaleDateString('es-ES', {month:'long', year:'numeric'});
  const primerDia = new Date(y, m, 1).getDay(); // 0=dom
  const offset = primerDia === 0 ? 6 : primerDia - 1; // ajustar a lunes
  const diasMes = new Date(y, m+1, 0).getDate();
  const asistSet = new Set(asis.map(a=>a.fecha));
  const asistMap = {};
  asis.forEach(a=>{ asistMap[a.fecha]=a.id; });
  const todayStr = today.toISOString().slice(0,10);
  const DOWS = ['L','M','X','J','V','S','D'];
  let cells = '';
  for(let i=0;i<offset;i++) cells+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=diasMes;d++){
    const fechaStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const esFuturo = fechaStr > todayStr;
    const esHoy = fechaStr === todayStr;
    const presente = asistSet.has(fechaStr);
    const asistId = asistMap[fechaStr];
    let cls = 'cal-day';
    if(esFuturo) cls+=' future';
    if(esHoy) cls+=' today';
    if(presente) cls+=' present';
    const onclick = esFuturo ? '' : presente
      ? `onclick="quitarAsistencia(${asistId})"`
      : `onclick="marcarAsistenciaFecha(${clientId},'${fechaStr}')"`;
    cells+=`<button class="${cls}" ${onclick} title="${fechaStr}">${d}</button>`;
  }
  return `
    <div class="cal-wrap">
      <div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap">
        <div class="metric" style="flex:1;min-width:100px"><div class="metric-label">Este mes</div><div class="metric-value">${totalMes}</div><div class="metric-sub">visitas</div></div>
        <div class="metric" style="flex:1;min-width:100px"><div class="metric-label">Total histórico</div><div class="metric-value">${total}</div><div class="metric-sub">visitas</div></div>
      </div>
      <div class="cal-header">
        <button class="btn small" onclick="calCambiarMes(${clientId},-1)"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
        <div class="cal-month">${mesNombre}</div>
        <button class="btn small" onclick="calCambiarMes(${clientId},1)" ${m===today.getMonth()&&y===today.getFullYear()?'disabled':''}>
          <i class="ti ti-chevron-right" aria-hidden="true"></i>
        </button>
      </div>
      <div class="cal-grid">
        ${DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      <div class="cal-legend">
        <span><span class="cal-legend-dot" style="background:var(--accent)"></span>Asistió</span>
        <span><span class="cal-legend-dot" style="outline:2px solid var(--blue);outline-offset:-1px;border-radius:50%"></span>Hoy</span>
        <span style="color:var(--text2)">Toca un día para marcar o quitar</span>
      </div>
    </div>
  `;
}

// ── Modal ──
function showModal(type, clientId) { state.showModal={type,clientId}; renderModal(); }
function closeModal() { state.showModal=null; renderModal(); }

function renderModal() {
  const root = document.getElementById('modal-root');
  if(!state.showModal){root.innerHTML='';return;}
  const {type,clientId}=state.showModal;
  const c=clientId?state.clients.find(x=>x.id===clientId):null;

function previewDocs(inputId, previewId) {
  const files=[...document.getElementById(inputId).files];
  const preview=document.getElementById(previewId);
  if(!preview) return;
  preview.innerHTML=files.map(f=>`

      <span class="doc-item-type">${(f.size/1024).toFixed(0)} KB</span>
    </div>`).join('');
}

async function openClient(id) {

  const c=state.clients.find(x=>x.id===id);

async function handleDocUpload(event, clientId) {
  const files=[...event.target.files];
  if(!files.length) return;
  const btn=document.querySelector('.btn.primary');
  try {
    const c=state.clients.find(x=>x.id===clientId);
    const docsActuales=c.documentos||[];
    toast('Subiendo documentos...');
    const nuevos=await Promise.all(files.map(f=>uploadDoc(f,`clientes/${clientId}`)));
    await db.from('clientes').update({documentos:[...docsActuales,...nuevos]}).eq('id',clientId);
    toast(`${nuevos.length} documento${nuevos.length!==1?'s':''} subido${nuevos.length!==1?'s':''} ✓`);
    await loadAll();
  } catch(e) {
    toast('Error al subir documento','error');
  }
}

async function saveNewClient() {
  const nombre=document.getElementById('f-nombre').value.trim();
  if(!nombre){toast('El nombre es obligatorio','error');return;}
  setBtnLoading('save-btn',true);
  const {data,error}=await db.from('clientes').insert({
    nombre,
    telefono:document.getElementById('f-tel').value,
    email:document.getElementById('f-email').value,
    inicio:document.getElementById('f-inicio').value||null,
    cobro:document.getElementById('f-cobro').value||null,
    plan:document.getElementById('f-plan').value,
    importe:parseFloat(document.getElementById('f-importe').value)||null,
    notas:document.getElementById('f-notas').value,
    estado:'Activo', documentos:[],
  }).select().single();
  if(error){toast('Error al crear cliente','error');setBtnLoading('save-btn',false);return;}
  const fileInput=document.getElementById('f-docs-new');
  if(fileInput&&fileInput.files.length) {
    try {
      const files=[...fileInput.files];
      const nuevos=await Promise.all(files.map(f=>uploadDoc(f,`clientes/${data.id}`)));
      await db.from('clientes').update({documentos:nuevos}).eq('id',data.id);
    } catch(e){toast('Cliente creado pero hubo un error con los documentos','error');}
  }
  toast('Cliente creado ✓');
  closeModal();
  await navigate('clients');
}

  const {error} = await db.from('asistencia').insert({cliente_id:clientId, fecha});

function calCambiarMes(clientId, dir) {
  if(!state.calMes) state.calMes = { y: today.getFullYear(), m: today.getMonth() };
  let { y, m } = state.calMes;
  m += dir;
  if(m > 11){ m=0; y++; }
  if(m < 0){ m=11; y--; }
  if(y > today.getFullYear() || (y===today.getFullYear() && m>today.getMonth())) return;
  state.calMes = { y, m };
  const el = document.getElementById('asist-content');
  if(el) el.innerHTML = renderAsistenciaCliente(clientId);
}

function actualizarPrecioVenta() {
  const sel=document.getElementById('f-vprod');
  const cant=parseInt(document.getElementById('f-vcantidad')?.value)||1;
  const precioInput=document.getElementById('f-vprecio');
  const totalEl=document.getElementById('venta-total');
  if(!sel||!sel.value){if(totalEl)totalEl.innerHTML='';return;}
  const opt=sel.options[sel.selectedIndex];
  const precio=parseFloat(opt.dataset.precio)||0;
  if(precioInput&&!precioInput._edited) precioInput.value=precio.toFixed(2);
  const total=(parseFloat(precioInput?.value)||precio)*cant;
  if(totalEl) totalEl.innerHTML=`Total: <strong style="color:var(--text);font-size:16px">$${total.toFixed(2)}</strong>`;
}

  if(cantidad>p.stock){toast('No hay suficiente stock','error');return;}
  setBtnLoading('save-btn',true);
  const total=cantidad*p.precio_venta;
  const {error:e1}=await db.from('ventas').insert({producto_id:productoId,cantidad,precio_venta:p.precio_venta,costo:p.costo,total});
  const {error:e2}=await db.from('productos').update({stock:p.stock-cantidad}).eq('id',productoId);
  if(e1||e2){toast('Error al registrar venta','error');setBtnLoading('save-btn',false);return;}
  toast(`Venta registrada — $${total.toFixed(2)} ✓`);
  closeModal();
  await loadAll();
}

async function registrarVenta() {
  const prodId=parseInt(document.getElementById('f-vprod').value);
  if(!prodId){toast('Selecciona un producto','error');return;}
  const p=state.productos.find(x=>x.id===prodId);
  const cantidad=parseInt(document.getElementById('f-vcantidad').value)||1;
  const precio=parseFloat(document.getElementById('f-vprecio').value)||p.precio_venta;
  if(cantidad>p.stock){toast('No hay suficiente stock','error');return;}
  setBtnLoading('save-btn',true);
  const total=cantidad*precio;
  const {error:e1}=await db.from('ventas').insert({producto_id:prodId,cantidad,precio_venta:precio,costo:p.costo,total});
  const {error:e2}=await db.from('productos').update({stock:p.stock-cantidad}).eq('id',prodId);
  if(e1||e2){toast('Error al registrar','error');setBtnLoading('save-btn',false);return;}
  toast(`Venta registrada — $${total.toFixed(2)} ✓`);
  closeModal();
  await loadAll();
}

function setBtnLoading(id,loading) {
  const btn=document.getElementById(id);
  if(btn){btn.disabled=loading;btn.textContent=loading?'Guardando...':'Guardar';}
}

// ── Arranque ──
(async()=>{
  document.querySelector('.app').style.display='none';
  const {data:{session}}=await db.auth.getSession();
  if(session){showApp();}
  else{document.getElementById('login-screen').style.display='flex';}
})();

const toggleSidebar = document.getElementById('toggleSidebar');
const showSidebar = document.getElementById('showSidebar');
const sidebar = document.getElementById('sidebar');
const main = document.querySelector('.main');

toggleSidebar.addEventListener('click', () => {
    sidebar.classList.add('ocultar');
    main.classList.add('expandido');
    showSidebar.classList.add('visible');
});

showSidebar.addEventListener('click', () => {
    sidebar.classList.remove('ocultar');
    main.classList.remove('expandido');
    showSidebar.classList.remove('visible');
});
</script>
